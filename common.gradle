// Convention script applied by every addon subproject (apply from: "${rootDir}/common.gradle").
// Expects the subproject to define BEFORE applying:
//   ext { mod_id, mod_name, mod_license, mod_version, mod_group_id, mod_authors, mod_description }
// Shared versions (minecraft/forge/mappings/dmz/...) come from the root gradle.properties.
// ForgeGradle & MixinGradle are on the root build classpath (see root build.gradle), so they
// can be applied here by id.

apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Run Gradle's ProcessResources on IDE output locations before launching the game
    // (required for the mods.toml property expansion to reach IDE runs).
    copyIdeResources = true

    runs {
        // Only the per-addon datagen run lives at the subproject level. The unified
        // runClient/runServer (all five addons + DMZ together) are defined in the ROOT
        // build.gradle — launch those from the root.
        data {
            workingDirectory project.file('run-data')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // DMZ (and other production mod jars) ship SRG-mapped mixin refmaps; the dev
            // runtime uses official names. Remap them or the run crashes on launch.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { create(mod_id) { source sourceSets.main } }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle automatically adds the Forge maven and Maven Central.

    // Shared local jars: DragonMineZ (blank:dragonminez) + WorldEdit fat jar (blank:worldedit-mod).
    // The flatDir module-coordinate form lets fg.deobf remap them (the group is ignored).
    flatDir { dirs "${rootDir}/libs" }

    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }        // Mixin AP / SpongeAPI
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }      // GeckoLib
    maven { url = 'https://maven.blamejared.com/' }                                  // misc Forge deps mirror
    maven { url = 'https://maven.theillusivec4.top/' }                               // Curios
    maven { url = 'https://modmaven.dev' }                                           // TerraBlender mirror
    maven { url = 'https://maven.enginehub.org/repo/' }                              // WorldEdit API
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'DevAuth'
        url = 'https://pkgs.dev.azure.com/djtheredstoner/DevAuth/_packaging/public/maven/v1'
        content { includeGroup 'me.djtheredstoner' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mixin annotation processor — generates each addon's refmap.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // DragonMineZ — the mod this whole suite extends. MANDATORY for every addon.
    // Single shared jar in <root>/libs, deobf-remapped to the dev mappings.
    implementation fg.deobf("blank:dragonminez:${dmz_version}")

    // DMZ's own hard dependencies — required so DMZ can load in the dev runtime.
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    implementation fg.deobf("com.github.glitchfiend:TerraBlender-forge:${terrablender_version}")
    implementation fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")

    // DevAuth — dev-only real Microsoft login for runClient (enabled via run properties at root).
    runtimeOnly "me.djtheredstoner:DevAuth-forge-latest:${devauth_version}"
}

// Mixin's annotation processor only emits a refmap for the classes it compiles in a given run —
// with incremental compilation, a build that doesn't touch any mixin class produces a jar WITHOUT
// the refmap, which crashes production servers ("could not find any targets ... No refMap loaded").
// Full recompiles are cheap here; correctness of the shipped jar is not negotiable.
tasks.withType(JavaCompile).configureEach {
    options.incremental = false
}

// Expand mod properties into mods.toml / pack.mcmeta.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }

    // The GPL licence text and the copyright notice travel inside every GPL jar. The Ragnarok Key is not GPL
    // (mod_license says so), so it gets neither.
    if (mod_license.toString().startsWith('GNU General Public License')) {
        from(rootProject.file('LICENSE'))
        from(rootProject.file('NOTICE'))
    }
}

// Regional locale fan-out.
//
// WHY THIS EXISTS: Minecraft 1.20.1 ships SEVEN independent Spanish locales
// (es_ar, es_cl, es_ec, es_es, es_mx, es_uy, es_ve) with NO regional fallback between them.
// LanguageManager only ever loads [en_us, <selected>], so a client set to es_mx reads en_us
// then es_mx and never touches es_es, rendering our Spanish strings as English. es_mx is the
// most common Latin American variant, so shipping only es_es leaves most Spanish speakers on
// English. To keep exactly ONE hand-maintained file per family, we copy es_es.json to its
// sibling locale codes at build time. Do not "clean this up" or hand-add the variants.
//
// To add another family later (e.g. pt_br -> its siblings), add one entry to localeFanOut below.
// The copies must NOT go through processResources.expand: they contain %s / %% format specifiers
// and literal %player% tokens that a template expander would mangle, and es_es.json is ~1092 keys.
def localeFanOut = [
        // source locale -> sibling locales that should receive a byte-for-byte copy
        'es_es': ['es_ar', 'es_cl', 'es_ec', 'es_mx', 'es_uy', 'es_ve'],
        // Portuguese has two locales in 1.20.1 and the same absence of fallback between them, so a pt_pt
        // client reading only en_us and pt_pt would render English. pt_br is the hand-maintained source
        // because it is the far larger part of the player base; pt_pt receives the copy. Brazilian wording
        // in Portugal is a smaller cost than English in both.
        'pt_br': ['pt_pt'],
]

def generateRegionalLocales = tasks.register('generateRegionalLocales', Copy) {
    description = 'Fans each source locale out to its regional siblings (see localeFanOut in common.gradle).'

    // Root of the generated tree. Files are placed under assets/<namespace>/lang/ inside it so that
    // processResources' `from(this)` below preserves that path and they land at the jar location
    // Minecraft actually reads locales from.
    into layout.buildDirectory.dir('generated/regionalLocales')

    // Wipe the tree first. A Copy task overwrites what it produces but never removes what it USED to
    // produce, so a namespace that stops shipping a locale leaves its old output behind and
    // processResources keeps folding it into the jar. That shipped five dead namespaces' worth of
    // Spanish files through the rename, from source folders that no longer existed.
    doFirst {
        delete destinationDir
    }

    // Scan EVERY resource source dir for assets/<namespace>/lang/<sourceLocale>.json and fan each
    // one out to its regional siblings inside that SAME namespace. This works for a single-namespace
    // addon (assets/<mod_id>/lang only) AND for the dmz_ragnarok aggregate, whose source set pulls in
    // all five addon trees so the real lang files live under their original namespaces (chiefly
    // assets/shuruisutilities/lang), not under assets/dmz_ragnarok. Reading srcDirs here inside the
    // task configuration closure (not at apply time) ensures the aggregate's appended srcDirs are
    // already present. A subproject that ships no lang files at all simply adds no
    // sources, leaving the Copy task a no-op with no stray output.
    localeFanOut.each { sourceLocale, siblings ->
        sourceSets.main.resources.srcDirs.each { root ->
            def assetsDir = new File(root, 'assets')
            if (assetsDir.isDirectory()) {
                assetsDir.eachDir { nsDir ->
                    def sourceFile = new File(nsDir, "lang/${sourceLocale}.json")
                    // Skip gracefully when this namespace has not translated the source locale.
                    if (sourceFile.isFile()) {
                        siblings.each { sibling ->
                            from(sourceFile) {
                                into "assets/${nsDir.name}/lang"
                                rename '.*', "${sibling}.json"
                            }
                        }
                    }
                }
            }
        }
    }
}

// Feed the generated copies into processResources' output so they land in the jar AND on the
// runClient classpath. `from` on a Copy-type task carries the generator as an input and keeps
// processResources up-to-date-checkable/incremental; the copies bypass the expand filter above
// because they are added here as plain files, not matched by filesMatching.
tasks.named('processResources', ProcessResources).configure {
    from(generateRegionalLocales)
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    // Reobfuscate the production jar back to SRG names.
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// Split guard, applied to EVERY suite project (core, the modules and the fat aggregate). Every
// @Mod.EventBusSubscriber across the five trees must carry the correct explicit modid, or the handler
// silently fails to register: with the trees now separate mod containers, Forge's AutomaticEventSubscriber
// defaults a bare modid to whichever container is being injected. The checker scans the sources of all five
// trees and FAILS the build on any missing or wrong modid, so building ANY project (a module alone, core,
// or the fat jar) catches a regression. It scans by absolute path, so it is the same audit wherever it runs.
def checkEventBusModids = tasks.register('checkEventBusModids', Exec) {
    group = 'verification'
    description = 'Fail the build if any @Mod.EventBusSubscriber lacks the correct explicit modid.'
    workingDir rootDir
    commandLine 'python3', "${rootDir}/tools/check-eventbus-modids.py", rootDir.toString()
}
tasks.named('check').configure { dependsOn checkEventBusModids }

// Split guard for the "private UI is not rendered without the key" rule: client code must read ClientGate,
// never the server-side key/tier gates (RagnarokKey, KeyGate.unlocked/present, PublicContent, and
// the enabled()/active() convenience wrappers). Those answer wrong on a physical client. Scans all five trees
// by absolute path, so building ANY project catches a regression.
def checkClientKeyReads = tasks.register('checkClientKeyReads', Exec) {
    group = 'verification'
    description = 'Fail the build if client-scoped code reads a server-side key/tier gate.'
    workingDir rootDir
    commandLine 'python3', "${rootDir}/tools/check-client-key-reads.py", rootDir.toString()
}
tasks.named('check').configure { dependsOn checkClientKeyReads }

