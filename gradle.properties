# Shared versions for the whole DMZ Ragnarok suite. Per-mod identity (mod_id, mod_name,
# mod_version, ...) lives in each subproject's build.gradle ext block — subproject
# gradle.properties files are NOT read by Gradle in a multi-project build.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.console=plain

# The DMZ Ragnarok suite version. EVERY suite jar carries exactly this version: the fat dmz_ragnarok jar, the
# modular core (dmz_ragnarok), dungeons, raids, tournaments and space jars, and the Ragnarok Key. The live line
# before it was 1.1.<build> (last live release 1.1.537). Bump it here for the next release (1.5.1 and so on);
# gradle/ragnarok-version.gradle explains test builds (-PtestBuild gives <version>-test.<n>).
ragnarok_version=1.5.1

minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# Core dependency: DragonMineZ (shared jar in ./libs, resolved via flatDir as blank:dragonminez)
dmz_version=2.1.3
# DMZ hard dependencies (needed for DMZ to load in the dev runtime)
geckolib_version=4.8.3
terrablender_version=1.20.1-3.0.1.10
curios_version=5.14.1+1.20.1

# Optional / dev-runtime mods
worldedit_version=7.2.15
customnpcs_version=1.20.1.20260227
cnpc_gecko_version=1.20.1-1.0.6
xaero_minimap_version=forge-1.20.1-26.1.0
xaero_worldmap_version=forge-1.20.1-1.41.2
devauth_version=1.2.2
