# DMZ Ragnarok: Tournaments module. One mod (dmz_ragnarok_tournaments) that requires DMZ Ragnarok core. It
# registers all of its content into the dmz_ragnarok namespace; this id is a Forge CONTAINER id only.
# Installing this jar alongside the fat jar (which also declares dmz_ragnarok_tournaments) makes Forge stop
# with a clear duplicate-mod error, the intended collision guard.
modLoader = "javafml" #mandatory
loaderVersion = "${loader_version_range}" #mandatory
license = "${mod_license}"

[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${mod_version}" #mandatory
displayName = "${mod_name}" #mandatory
authors = "${mod_authors}" #optional
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge" #mandatory
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# DMZ Ragnarok core: shared code, compiled against and required at runtime. MANDATORY, AFTER. At least this jar's own version (every suite jar
# of one build carries the same version).
[[dependencies."${mod_id}"]]
modId = "dmz_ragnarok"
mandatory = true
versionRange = "[${mod_version},)"
ordering = "AFTER"
side = "BOTH"

# DragonMine Z, the base mod.
[[dependencies."${mod_id}"]]
modId = "dragonminez"
mandatory = true
versionRange = "[2.1.1b,)"
ordering = "AFTER"
side = "BOTH"

# WorldEdit, SOFT: tournament arena bounds. Guarded; absent -> degrades.
[[dependencies."${mod_id}"]]
modId = "worldedit"
mandatory = false
versionRange = "[7.2,)"
ordering = "AFTER"
side = "BOTH"
