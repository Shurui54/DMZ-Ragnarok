// DMZ Ragnarok: Raid Bosses module (mod id dmz_ragnarok_raids).
//
// A standalone module jar of the modular build. It compiles against :dmz_ragnarok_core as a real project
// dependency (shared code lives ONCE, in core) and depends on core at runtime (mandatory, loads AFTER it).
// It registers into the dmz_ragnarok namespace, so an existing world is unchanged whether this module
// arrives as its own jar or inside the fat jar. The same sources are also compiled into the fat jar.
//
// Rifts and Z-Souls are kept as separable packages behind the core hooks (DungeonArenaHook / ZSoulHook),
// so they can be lifted into a later server-side jar without touching the rest of this module.

// One suite version for every jar (root gradle.properties ragnarok_version; see gradle/ragnarok-version.gradle).
apply from: "${rootDir}/gradle/ragnarok-version.gradle"

ext {
    mod_id = 'dmz_ragnarok_raids'
    mod_name = 'DMZ Ragnarok: Raid Bosses'
    mod_license = 'GNU General Public License v3.0'
    mod_version = ragnarok_mod_version
    mod_group_id = 'net.shurui.dev'
    mod_authors = 'Shurui'
    mod_description = 'The automated raid boss manager (and rifts / Z-Souls) for DMZ Ragnarok. Registers into the dmz_ragnarok namespace; requires DMZ Ragnarok core.'
}

apply from: "${rootDir}/common.gradle"

dependencies {
    implementation project(':dmz_ragnarok_core')
}

mixin {
    add sourceSets.main, "shuruis_raid_bosses.refmap.json"
    config 'shuruis_raid_bosses.mixins.json'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(['MixinConfigs': 'shuruis_raid_bosses.mixins.json'])
    }
}
